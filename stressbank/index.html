<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geldcheck Stressbank</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;color:#111;margin:0;padding:22px}
main{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin-bottom:14px}
h1{font-size:38px;line-height:1.02;margin:0 0 10px}p{color:#777;line-height:1.45}
button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}
.score{font-size:52px;font-weight:900;margin:18px 0 2px}.ok{color:#19765f}.bad{color:#a33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f7f5ef;border-radius:18px;padding:16px}.stat b{font-size:24px;display:block}.small{font-size:12px;color:#777}.fail{color:#a33}
</style></head><body><main>
<div class="card"><h1>Geldcheck Stressbank 1500</h1><p>15 financiële families × 100 varianten. Hier testen we niet alleen rekenen, maar of de richting van de conclusie robuust blijft onder veel verschillende huishoudens.</p><p class="small"><b>Build M1 · metamorfische intelligentietest</b></p><button id="run">Run 1500 inhoudelijke scenario's</button><button id="meta" style="margin-top:10px;background:#111">Run intelligentietest</button><button id="conflict" style="margin-top:10px;background:#8b2f2f">Run contradictie-/extrementest</button><div id="summary"></div><div id="metaSummary"></div><div id="conflictSummary"></div></div>
<div id="groups"></div></main>
<script>/* Geldcheck Generic Financial Reasoning Engine v1.0
   Goal: consistent reasoning across many household configurations.
   No customer-specific hardcoding. All thresholds are transparent heuristics.
*/
(function(global){
  "use strict";

  const ASSUMPTIONS = {
    inflation: 0.02,
    returnScenarios: [0.03,0.05,0.07],
    withdrawalRefs: [0.03,0.04],
    bufferMonths: {minimum:3, solid:6, strong:12},
    highInterestDebt: 0.06,
    materialSavingsGapPct: 0.20
  };

  const finite = v => typeof v === "number" && Number.isFinite(v);
  const num = v => {
    if(v===null || v===undefined || v==="") return null;
    const n = Number(String(v).replace(",","."));
    return Number.isFinite(n) ? n : null;
  };
  const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
  const months = (capital, monthlyCost) => finite(capital)&&finite(monthlyCost)&&monthlyCost>0 ? capital/monthlyCost : null;
  const fv = (pv,r,y) => finite(pv)&&finite(r)&&finite(y)&&y>=0 ? pv*Math.pow(1+r,y) : null;
  const real = (nominal,infl,y) => finite(nominal)&&finite(infl)&&finite(y) ? nominal/Math.pow(1+infl,y) : null;

  function normalize(raw){
    const c = {
      age:num(raw.age), household:raw.household||"", kids:num(raw.kids)||0, goal:raw.goal||"health",
      income:num(raw.income), otherIncome:num(raw.otherIncome)||0, cost:num(raw.cost),
      annualIncluded:raw.annualIncluded===true||raw.annualIncluded==="yes",
      savingGrowth:num(raw.savingGrowth),
      housing:raw.housing||"", mortgage:num(raw.mortgage), mortgageRate:num(raw.mortgageRate),
      mortgageEndAge:num(raw.mortgageEndAge), mortgagePayment:num(raw.mortgagePayment), rent:num(raw.rent),
      cash:num(raw.cash)||0, investments:num(raw.investments)||0, debt:num(raw.debt)||0,
      debtRate:num(raw.debtRate), debtPayment:num(raw.debtPayment),
      retireAge:num(raw.retireAge), aow:num(raw.aow)||0, pension:num(raw.pension)||0,
      change:raw.change||"", purchaseAmount:num(raw.purchaseAmount), purchaseMonths:num(raw.purchaseMonths)
    };
    c.totalIncome = (c.income||0)+(c.otherIncome||0);
    c.netFinancialAssets = c.cash+c.investments-c.debt;
    c.monthlySurplus = finite(c.cost) ? c.totalIncome-c.cost : null;
    c.savingsRate = finite(c.monthlySurplus)&&c.totalIncome>0 ? c.monthlySurplus/c.totalIncome : null;
    c.cashBufferMonths = months(c.cash,c.cost);
    c.financialRunwayMonths = months(Math.max(0,c.netFinancialAssets),c.cost);
    c.retirementHorizon = finite(c.age)&&finite(c.retireAge) ? c.retireAge-c.age : null;
    return c;
  }

  function requiredEvidence(c){
    const req = [
      ["age","leeftijd",finite(c.age)],
      ["income","netto inkomen",c.totalIncome>0],
      ["cost","maanduitgaven",finite(c.cost)&&c.cost>=0]
    ];
    if(c.goal==="retirement"||c.goal==="early"){
      req.push(["retireAge","gewenste pensioenleeftijd",finite(c.retireAge)]);
      req.push(["assets","spaargeld of beleggingen",c.cash>0||c.investments>0]);
    }
    if(c.goal==="purchase"){
      req.push(["purchaseAmount","bedrag van de grote uitgave",finite(c.purchaseAmount)&&c.purchaseAmount>0]);
      req.push(["purchaseMonths","termijn van de grote uitgave",finite(c.purchaseMonths)&&c.purchaseMonths>0]);
    }
    if(c.housing==="mortgage"){
      req.push(["mortgage","hypotheekschuld",finite(c.mortgage)&&c.mortgage>=0]);
    }
    return req.filter(x=>!x[2]).map(x=>({key:x[0],label:x[1]}));
  }

  function dimensions(c){
    const d = {};

    d.cashflow = {
      surplus:c.monthlySurplus,
      savingsRate:c.savingsRate,
      status: !finite(c.monthlySurplus) ? "unknown" :
              c.monthlySurplus<0 ? "weak" :
              c.savingsRate!==null && c.savingsRate>=0.20 ? "strong" :
              c.savingsRate!==null && c.savingsRate>=0.05 ? "ok" : "thin"
    };

    d.liquidity = {
      cash:c.cash,
      bufferMonths:c.cashBufferMonths,
      status: !finite(c.cashBufferMonths) ? "unknown" :
              c.cashBufferMonths>=ASSUMPTIONS.bufferMonths.strong ? "strong" :
              c.cashBufferMonths>=ASSUMPTIONS.bufferMonths.solid ? "solid" :
              c.cashBufferMonths>=ASSUMPTIONS.bufferMonths.minimum ? "thin" : "weak"
    };

    d.wealth = {
      cash:c.cash, investments:c.investments, debt:c.debt, net:c.netFinancialAssets,
      runwayMonths:c.financialRunwayMonths,
      investShare:(c.cash+c.investments)>0 ? c.investments/(c.cash+c.investments) : null
    };

    const annualIncome = c.totalIncome*12;
    d.debt = {
      nonMortgage:c.debt,
      nonMortgageRate:c.debtRate,
      mortgage:c.mortgage,
      mortgageRate:c.mortgageRate,
      debtToIncome:annualIncome>0 ? c.debt/annualIncome : null,
      mortgageToIncome:annualIncome>0&&finite(c.mortgage) ? c.mortgage/annualIncome : null,
      highInterest: c.debt>0 && finite(c.debtRate) && c.debtRate>=ASSUMPTIONS.highInterestDebt
    };

    d.housing = {
      type:c.housing,
      monthlyKnown: c.housing==="rent" ? c.rent : c.mortgagePayment,
      mortgageEndsAfterRetirement: c.housing==="mortgage"&&finite(c.mortgageEndAge)&&finite(c.retireAge) ? c.mortgageEndAge>c.retireAge : null
    };

    d.lifeStage = {
      age:c.age, household:c.household, kids:c.kids,
      horizonToRetirement:c.retirementHorizon,
      retirementRelevant: c.goal==="retirement"||c.goal==="early"||(finite(c.age)&&c.age>=50)
    };

    return d;
  }

  function scenarios(c){
    const s = {investment:[], retirement:null, purchase:null, reconciliation:null};

    if(c.investments>0){
      let horizon = null;
      if(finite(c.retirementHorizon)&&c.retirementHorizon>=0) horizon=c.retirementHorizon;
      else if(finite(c.age)) horizon = Math.max(5,Math.min(30,65-c.age));
      if(finite(horizon)&&horizon>=0){
        s.investment = ASSUMPTIONS.returnScenarios.map(r=>{
          const nominal=fv(c.investments,r,horizon);
          return {return:r,horizon,nominal,real:real(nominal,ASSUMPTIONS.inflation,horizon)};
        });
      }
    }

    if((c.goal==="retirement"||c.goal==="early"||(finite(c.age)&&c.age>=50)) && finite(c.retirementHorizon) && c.retirementHorizon>=0){
      const monthlyPensionIncome=c.aow+c.pension;
      const currentEuroGap=finite(c.cost)?Math.max(0,c.cost-monthlyPensionIncome):null;
      const targetMid=s.investment.find(x=>Math.abs(x.return-0.05)<0.0001);
      const projected=targetMid?targetMid.nominal:null;
      const annualGap=finite(currentEuroGap)?currentEuroGap*12:null;
      const gapPct=finite(projected)&&projected>0&&finite(annualGap)?annualGap/projected:null;
      s.retirement={monthlyPensionIncome,currentEuroGap,projectedCapitalAt5:projected,gapWithdrawalPct:gapPct,
        mortgageAfterRetirement: c.housing==="mortgage"&&finite(c.mortgageEndAge)&&finite(c.retireAge)?c.mortgageEndAge>c.retireAge:null};
    }

    if(c.goal==="purchase"&&finite(c.purchaseAmount)&&finite(c.purchaseMonths)&&c.purchaseMonths>0){
      const monthlyReserve=c.purchaseAmount/c.purchaseMonths;
      const cashAfter=c.cash-c.purchaseAmount;
      s.purchase={monthlyReserve, fitsMonthly:finite(c.monthlySurplus)?c.monthlySurplus>=monthlyReserve:null,
        cashAfter, bufferMonthsAfter:finite(c.cost)&&c.cost>0?cashAfter/c.cost:null};
    }

    if(c.goal==="cashflow"&&finite(c.monthlySurplus)&&finite(c.savingGrowth)){
      const gap=c.monthlySurplus-c.savingGrowth;
      s.reconciliation={paperSurplus:c.monthlySurplus,actualSaving:c.savingGrowth,gap,
        material:Math.abs(gap)>Math.max(100,Math.abs(c.monthlySurplus)*ASSUMPTIONS.materialSavingsGapPct)};
    }
    return s;
  }

  function findings(c,d,s){
    const arr=[];
    const add=(kind,priority,title,text,dimension)=>arr.push({kind,priority,title,text,dimension});

    if(finite(c.monthlySurplus)){
      if(c.monthlySurplus<0) add("risk",100,"Je maandbasis is negatief.","Op basis van de bevestigde bedragen gaat er meer uit dan er binnenkomt.","cashflow");
      else if(c.monthlySurplus>0) add("strength",55,"Je maandbasis is positief.","De theoretische ruimte is "+Math.round(c.monthlySurplus)+" per maand, vóór controle op jaar- en incidentele uitgaven.","cashflow");
    }
    if(!c.annualIncluded&&finite(c.cost)) add("uncertainty",75,"Je echte vrije ruimte kan lager zijn.","Niet alle jaar- en incidentele uitgaven zijn bevestigd in het maandbedrag.","cashflow");

    if(finite(c.cashBufferMonths)){
      if(c.cashBufferMonths<3) add("risk",90,"Je liquide buffer is kwetsbaar.","Spaargeld dekt minder dan drie maanden van de huidige uitgaven.","liquidity");
      else if(c.cashBufferMonths>=12) add("strength",45,"Je liquide buffer is ruim.","Spaargeld dekt meer dan twaalf maanden van de huidige uitgaven.","liquidity");
      else if(c.cashBufferMonths>=6) add("strength",40,"Je liquide buffer is solide.","Spaargeld dekt minstens zes maanden van de huidige uitgaven.","liquidity");
    }

    if(d.debt.highInterest) add("risk",85,"Je dure schuld verdient prioriteit.","De opgegeven rente op andere schuld is relatief hoog; vergelijk zeker aflossen met andere bestedingen.","debt");

    if(s.reconciliation&&s.reconciliation.material){
      add("insight",95,"Je geldbeeld sluit niet aan op je rekening.","De papieren maandruimte wijkt ongeveer "+Math.round(s.reconciliation.gap)+" per maand af van de werkelijke spaargroei. Zoek eerst de ontbrekende uitgaven.","cashflow");
    }

    if(d.housing.mortgageEndsAfterRetirement===true){
      add("risk",70,"Je hypotheek loopt door na je gewenste pensioen.","De woonlast hoort daarom expliciet in de pensioenfase en niet alleen in je huidige budget.","housing");
    }

    if(s.retirement){
      if(finite(s.retirement.currentEuroGap)&&s.retirement.currentEuroGap>0){
        add("insight",72,"Je pensioeninkomen dekt niet alle huidige uitgaven.","In euro's van vandaag resteert circa "+Math.round(s.retirement.currentEuroGap)+" per maand dat uit vermogen of ander inkomen moet komen.","retirement");
      }
      if(finite(s.retirement.gapWithdrawalPct)){
        if(s.retirement.gapWithdrawalPct>0.05) add("risk",88,"De benodigde onttrekking is hoog in het 5%-groeiscenario.","De eerste berekening vraagt om een strengere stress- en sequence-risk analyse.","retirement");
        else if(s.retirement.gapWithdrawalPct<0.03) add("strength",50,"De benodigde onttrekking oogt beperkt tegenover het geprojecteerde vermogen.","Dit blijft gevoelig voor rendement, inflatie en marktvolgorde.","retirement");
      }
    }

    if(s.purchase){
      if(s.purchase.fitsMonthly===false) add("risk",90,"De geplande uitgave past niet uit de huidige maandruimte.","De benodigde reservering per maand ligt boven de berekende vrije ruimte.","goal");
      if(finite(s.purchase.bufferMonthsAfter)&&s.purchase.bufferMonthsAfter<3) add("risk",92,"De uitgave zou je buffer te ver verlagen.","Na betaling resteert minder dan drie maanden huidige uitgaven als cashbuffer.","goal");
      if(s.purchase.fitsMonthly===true&&finite(s.purchase.bufferMonthsAfter)&&s.purchase.bufferMonthsAfter>=6) add("strength",60,"De grote uitgave lijkt vanuit cashflow en buffer haalbaar.","Dit is nog vóór belasting, toekomstdoelen en overige onzekerheden.","goal");
    }

    if(c.investments>0&&finite(c.age)){
      const ratio=finite(c.cost)&&c.cost>0 ? c.investments/(c.cost*12) : null;
      if(finite(ratio)&&ratio>=20) add("strength",38,"Je belegd vermogen is groot ten opzichte van je huidige uitgaven.","Dat geeft flexibiliteit, maar maakt vermogensrisico en fiscale context belangrijker.","wealth");
    }

    return arr.sort((a,b)=>b.priority-a.priority);
  }

  function score(c,d,missing,finds){
    if(missing.some(m=>m.key==="income"||m.key==="cost")) return {value:null,label:"onvoldoende informatie"};
    if(missing.length>=3) return {value:null,label:"onvoldoende informatie"};
    let x=50;
    if(d.cashflow.status==="strong")x+=15; else if(d.cashflow.status==="ok")x+=8; else if(d.cashflow.status==="thin")x+=2; else if(d.cashflow.status==="weak")x-=20;
    if(d.liquidity.status==="strong")x+=15; else if(d.liquidity.status==="solid")x+=10; else if(d.liquidity.status==="thin")x+=2; else if(d.liquidity.status==="weak")x-=15;
    if(d.debt.highInterest)x-=12;
    finds.filter(f=>f.kind==="risk"&&f.priority>=85).forEach(()=>x-=6);
    x=clamp(Math.round(x),0,100);
    const label=x>=80?"zeer stevig":x>=65?"stevig":x>=50?"redelijk":x>=35?"kwetsbaar":"aandacht nodig";
    return {value:x,label};
  }

  function nextQuestions(c,missing,d,s){
    const qs=missing.map(m=>({priority:100,title:"Vul "+m.label+" in",why:"Zonder dit gegeven kan de hoofdvraag materieel anders uitvallen."}));
    if(!c.annualIncluded&&finite(c.cost))qs.push({priority:82,title:"Zijn vakantie, auto, onderhoud en andere jaarposten echt meegenomen?",why:"Anders overschatten we de vrije maandruimte."});
    if(c.housing==="mortgage"&&finite(c.mortgage)&&!finite(c.mortgageEndAge))qs.push({priority:78,title:"Wanneer eindigt je hypotheek?",why:"Dat bepaalt de woonlast in latere levensfasen."});
    if(c.debt>0&&!finite(c.debtRate))qs.push({priority:76,title:"Welke rente betaal je op de andere schuld?",why:"Dure schuld kan belangrijker zijn dan sparen of beleggen."});
    if(c.goal==="cashflow"&&!finite(c.savingGrowth))qs.push({priority:85,title:"Hoeveel groeit je spaargeld werkelijk per maand?",why:"Daarmee kunnen we papieren ruimte en echte ruimte reconciliëren."});
    return qs.sort((a,b)=>b.priority-a.priority).slice(0,3);
  }

  function analyze(raw){
    const c=normalize(raw||{});
    const missing=requiredEvidence(c);
    const d=dimensions(c);
    const s=scenarios(c);
    const f=findings(c,d,s);
    const sc=score(c,d,missing,f);
    const questions=nextQuestions(c,missing,d,s);
    const top=f.slice(0,3);
    return {case:c,assumptions:ASSUMPTIONS,missing,dimensions:d,scenarios:s,findings:f,topFindings:top,score:sc,nextQuestions:questions};
  }

  global.GeldcheckEngine={analyze,normalize,ASSUMPTIONS};
})(window);
</script>
<script>
window.onerror=function(msg,src,line,col){document.getElementById('summary').innerHTML='<div class="score bad">JS FOUT</div><b>'+msg+'</b><div class="small">regel '+line+':'+col+'</div>'};
(function(){
function has(a,s){s=s.toLowerCase();return a.findings.some(function(f){return (f.title+' '+f.text).toLowerCase().indexOf(s)>=0})}
function addFail(arr,msg){arr.push(msg)}
function family(name,make,check){return {name:name,make:make,check:check}}
var fam=[];

fam.push(family('Negatieve cashflow',function(k){return {age:25+k%35,goal:'health',income:2200+k*5,cost:3000+k*4,cash:4000+k*20,investments:10000+k*30,debt:0,annualIncluded:true}},function(a,e){if(a.dimensions.cashflow.status!=='weak')addFail(e,'cashflow niet weak');if(!has(a,'maandbasis is negatief'))addFail(e,'finding ontbreekt')}));
fam.push(family('Sterke cashflow',function(k){return {age:25+k%35,goal:'health',income:5000+k*8,cost:2500+k*3,cash:20000+k*50,investments:50000+k*100,debt:0,annualIncluded:true}},function(a,e){if(a.dimensions.cashflow.status!=='strong')addFail(e,'cashflow niet strong')}));
fam.push(family('Zeer lage buffer',function(k){var cost=2500+k*2;return {age:30+k%20,goal:'health',income:4200+k*3,cost:cost,cash:cost*(.5+(k%20)/20),investments:10000,debt:0,annualIncluded:true}},function(a,e){if(a.dimensions.liquidity.status!=='weak')addFail(e,'buffer niet weak');if(!has(a,'liquide buffer is kwetsbaar'))addFail(e,'bufferfinding ontbreekt')}));
fam.push(family('Ruime buffer',function(k){var cost=2200+k*2;return {age:30+k%25,goal:'health',income:4800+k*4,cost:cost,cash:cost*(14+(k%10)),investments:30000,debt:0,annualIncluded:true}},function(a,e){if(a.dimensions.liquidity.status!=='strong')addFail(e,'buffer niet strong')}));
fam.push(family('Dure schuld',function(k){return {age:28+k%35,goal:'health',income:4500+k*4,cost:3000+k*2,cash:12000,investments:15000,debt:15000+k*100,debtRate:.07+(k%5)*.005,annualIncluded:true}},function(a,e){if(!a.dimensions.debt.highInterest)addFail(e,'highInterest false');if(!has(a,'dure schuld'))addFail(e,'schuldfinding ontbreekt')}));
fam.push(family('Cashflow reconciliation',function(k){return {age:35+k%20,goal:'cashflow',income:6000+k*5,cost:4300+k*3,cash:30000,investments:25000,debt:0,annualIncluded:false,savingGrowth:300+(k%10)*20}},function(a,e){if(!a.scenarios.reconciliation||!a.scenarios.reconciliation.material)addFail(e,'gap niet materieel');if(!has(a,'geldbeeld sluit niet aan'))addFail(e,'reconciliation finding ontbreekt')}));
fam.push(family('Hypotheek na pensioen',function(k){var age=50+k%10;return {age:age,goal:'retirement',income:4200,cost:2800,cash:35000,investments:180000+k*500,debt:0,housing:'mortgage',mortgage:240000+k*500,mortgageRate:.035,mortgageEndAge:82,retireAge:67,aow:1500,pension:500,annualIncluded:true}},function(a,e){if(a.dimensions.housing.mortgageEndsAfterRetirement!==true)addFail(e,'hypotheek niet doorlopend');if(!has(a,'hypotheek loopt door'))addFail(e,'hypotheekfinding ontbreekt')}));
fam.push(family('Hypotheek vóór pensioen klaar',function(k){var age=45+k%10;return {age:age,goal:'retirement',income:5000,cost:3000,cash:40000,investments:220000,debt:0,housing:'mortgage',mortgage:180000,mortgageRate:.03,mortgageEndAge:62,retireAge:67,aow:1500,pension:900,annualIncluded:true}},function(a,e){if(a.dimensions.housing.mortgageEndsAfterRetirement!==false)addFail(e,'hypotheek moet vóór pensioen eindigen')}));
fam.push(family('Pensioentekort',function(k){var cost=2800+k*2;return {age:58+k%6,goal:'retirement',income:3800,cost:cost,cash:25000,investments:180000+k*300,debt:0,retireAge:67,aow:1500,pension:300,annualIncluded:true}},function(a,e){if(!a.scenarios.retirement||!(a.scenarios.retirement.currentEuroGap>0))addFail(e,'geen pensioengat');if(!has(a,'pensioeninkomen dekt niet'))addFail(e,'pensioenfinding ontbreekt')}));
fam.push(family('Pensioen volledig gedekt',function(k){var cost=2300+k;return {age:60+k%5,goal:'retirement',income:4200,cost:cost,cash:50000,investments:300000,debt:0,retireAge:67,aow:1600,pension:1200,annualIncluded:true}},function(a,e){if(!a.scenarios.retirement||a.scenarios.retirement.currentEuroGap!==0)addFail(e,'pensioengat niet nul')}));
fam.push(family('Grote uitgave haalbaar',function(k){var amount=12000+(k%20)*250;return {age:30+k%20,goal:'purchase',income:6500,cost:3500,cash:90000,investments:120000,debt:0,purchaseAmount:amount,purchaseMonths:24,annualIncluded:true}},function(a,e){if(!a.scenarios.purchase||a.scenarios.purchase.fitsMonthly!==true)addFail(e,'uitgave past niet');if(!(a.scenarios.purchase.bufferMonthsAfter>=6))addFail(e,'buffer na uitgave <6')}));
fam.push(family('Grote uitgave onhaalbaar',function(k){return {age:30+k%15,goal:'purchase',income:3500,cost:3000,cash:5000+(k%10)*100,investments:5000,debt:0,purchaseAmount:30000+(k%10)*500,purchaseMonths:12,annualIncluded:true}},function(a,e){if(!a.scenarios.purchase||a.scenarios.purchase.fitsMonthly!==false)addFail(e,'uitgave hoort niet te passen');if(!has(a,'past niet uit de huidige maandruimte'))addFail(e,'purchase finding ontbreekt')}));
fam.push(family('Groot belegd vermogen',function(k){var cost=3000+(k%10)*20;return {age:22+k%18,goal:'health',income:5000,cost:cost,cash:60000,investments:900000+k*5000,debt:0,annualIncluded:true}},function(a,e){if(!has(a,'belegd vermogen is groot'))addFail(e,'wealth finding ontbreekt');if(a.scenarios.investment.length!==3)addFail(e,'investeringsscenario’s ontbreken')}));
fam.push(family('Onvoldoende bewijs',function(k){return {age:25+k%40,goal:'health',income:null,cost:null,cash:5000+k*10,investments:0,debt:0}},function(a,e){if(a.score.value!==null)addFail(e,'score hoort null te zijn');if(a.score.label!=='onvoldoende informatie')addFail(e,'label fout')}));
fam.push(family('Gezond gemengd huishouden',function(k){var income=4200+k*8,cost=3000+k*3;return {age:30+k%30,goal:'health',income:income,cost:cost,cash:22000+k*40,investments:60000+k*150,debt:0,annualIncluded:true}},function(a,e){if(a.dimensions.cashflow.status==='weak')addFail(e,'cashflow onterecht weak');if(a.score.value===null)addFail(e,'score ontbreekt')}));

document.getElementById('conflict').onclick=function(){
 var tests=[],pass=0;
 function C(name,x,check){var a=GeldcheckEngine.analyze(x),ok=false,msg='';try{ok=check(a);if(!ok)msg='engine mist de financiële spanning'}catch(e){msg=String(e)}tests.push({name:name,ok:ok,msg:msg});if(ok)pass++}
 C('Miljonair maar negatieve cashflow',{age:45,goal:'health',income:5000,cost:15000,cash:50000,investments:2000000,debt:0,annualIncluded:true},function(a){return a.case.monthlySurplus<0 && a.score.value<80});
 C('Veel beleggingen maar nul noodbuffer',{age:40,goal:'health',income:6000,cost:5000,cash:0,investments:500000,debt:0,annualIncluded:true},function(a){return a.dimensions.liquidity.bufferMonths===0 && a.score.value<90});
 C('Hoog inkomen met dure schuld',{age:38,goal:'health',income:12000,cost:7000,cash:20000,investments:50000,debt:250000,debtRate:.11,annualIncluded:true},function(a){return a.dimensions.debt.highInterest===true && a.score.value<90});
 C('Bijna pensioen met groot vermogen maar inkomensgat',{age:66,goal:'retirement',income:5000,cost:6000,cash:50000,investments:900000,debt:0,retireAge:67,aow:1500,pension:500,annualIncluded:true},function(a){return a.scenarios.retirement.currentEuroGap>0});
 C('Rijk op papier maar illiquide',{age:50,goal:'health',income:4000,cost:5000,cash:1000,investments:1500000,debt:0,annualIncluded:true},function(a){return a.dimensions.liquidity.bufferMonths<1 && a.case.monthlySurplus<0});
 C('Grote aankoop vreet volledige cashbuffer op',{age:42,goal:'purchase',income:7000,cost:4500,cash:60000,investments:200000,debt:0,purchaseAmount:60000,purchaseMonths:6,annualIncluded:true},function(a){return a.scenarios.purchase.bufferMonthsAfter<=0});
 C('Negatieve maandbasis ondanks vermogen',{age:30,goal:'cashflow',income:3000,cost:5500,cash:100000,investments:400000,debt:0,annualIncluded:true},function(a){return a.case.monthlySurplus===-2500 && a.score.value<80});
 C('Geen inkomen: evidence gate wint van vermogen',{age:50,goal:'health',income:null,cost:4000,cash:500000,investments:2000000,debt:0,annualIncluded:true},function(a){return a.score.value===null});
 C('Nul uitgaven is geen normale huishoudsituatie',{age:35,goal:'health',income:5000,cost:0,cash:30000,investments:50000,debt:0,annualIncluded:true},function(a){return a.score.value===null || a.case.monthlySurplus===5000});
 C('Pensioen al bereikt: horizon mag niet positief fantaseren',{age:70,goal:'retirement',income:2500,cost:3500,cash:30000,investments:400000,debt:0,retireAge:67,aow:1500,pension:1000,annualIncluded:true},function(a){return a.case.retirementHorizon<=0});
 var html='<div class="card"><h1>Contradictie-/extrementest</h1><div class="score '+(pass===tests.length?'ok':'bad')+'">'+pass+' / '+tests.length+'</div><b>'+(pass===tests.length?'Alle financiële spanningen herkend':'Hier zitten echte blinde vlekken')+'</b></div>';
 tests.forEach(function(t){html+='<div class="card"><b class="'+(t.ok?'ok':'bad')+'">'+(t.ok?'PASS':'FAIL')+'</b> · '+t.name+(t.msg?'<div class="small">'+t.msg+'</div>':'')+'</div>'});
 document.getElementById('conflictSummary').innerHTML=html;document.getElementById('conflictSummary').scrollIntoView({behavior:'smooth'});
};
document.getElementById('meta').onclick=function(){
 var tests=[], pass=0;
 function T(name,base,mutate,check){
   var a=GeldcheckEngine.analyze(base), b=GeldcheckEngine.analyze(Object.assign({},base,mutate));
   var ok=false,msg='';
   try{ok=check(a,b);if(!ok)msg='verwachte richting ontbreekt'}catch(e){msg=String(e)}
   tests.push({name:name,ok:ok,msg:msg}); if(ok)pass++;
 }
 var healthy={age:45,goal:'health',income:5000,cost:3500,cash:25000,investments:150000,debt:0,annualIncluded:true};
 T('Meer inkomen mag financiële positie niet verslechteren',healthy,{income:6500},function(a,b){return b.score.value>=a.score.value&&b.case.monthlySurplus>a.case.monthlySurplus});
 T('Hogere uitgaven moeten maandruimte verlagen',healthy,{cost:4500},function(a,b){return b.case.monthlySurplus<a.case.monthlySurplus&&b.score.value<=a.score.value});
 T('Meer cash moet liquiditeit niet verslechteren',healthy,{cash:60000},function(a,b){return b.dimensions.liquidity.bufferMonths>a.dimensions.liquidity.bufferMonths&&b.score.value>=a.score.value});
 T('Dure schuld moet risico toevoegen',healthy,{debt:40000,debtRate:.09},function(a,b){return !a.dimensions.debt.highInterest&&b.dimensions.debt.highInterest&&b.score.value<a.score.value});
 T('Leeftijd alleen mag huidige cashflow niet veranderen',healthy,{age:70},function(a,b){return a.case.monthlySurplus===b.case.monthlySurplus});
 var ret={age:55,goal:'retirement',income:5000,cost:3500,cash:50000,investments:300000,debt:0,retireAge:67,aow:1500,pension:700,annualIncluded:true};
 T('Later pensioen moet beleggingshorizon verlengen',ret,{retireAge:70},function(a,b){return b.case.retirementHorizon>a.case.retirementHorizon&&b.scenarios.investment[1].nominal>a.scenarios.investment[1].nominal});
 T('Meer pensioeninkomen moet pensioengat verkleinen',ret,{pension:1500},function(a,b){return b.scenarios.retirement.currentEuroGap<a.scenarios.retirement.currentEuroGap});
 T('Meer beleggingen mogen runway niet verlagen',healthy,{investments:500000},function(a,b){return b.dimensions.wealth.runwayMonths>a.dimensions.wealth.runwayMonths});
 var buy={age:40,goal:'purchase',income:6000,cost:3500,cash:80000,investments:100000,debt:0,purchaseAmount:20000,purchaseMonths:24,annualIncluded:true};
 T('Duurdere aankoop moet buffer na aankoop verlagen',buy,{purchaseAmount:50000},function(a,b){return b.scenarios.purchase.bufferMonthsAfter<a.scenarios.purchase.bufferMonthsAfter});
 T('Langere spaartijd moet maandreservering verlagen',buy,{purchaseMonths:48},function(a,b){return b.scenarios.purchase.monthlyReserve<a.scenarios.purchase.monthlyReserve});
 var cf={age:40,goal:'cashflow',income:6000,cost:4000,cash:30000,investments:50000,debt:0,annualIncluded:false,savingGrowth:500};
 T('Werkelijke spaargroei dichter bij papier moet reconciliation verbeteren',cf,{savingGrowth:1900},function(a,b){return Math.abs(b.scenarios.reconciliation.gap)<Math.abs(a.scenarios.reconciliation.gap)});
 T('Ontbrekend kernbewijs moet oordeel blokkeren',healthy,{income:null},function(a,b){return a.score.value!==null&&b.score.value===null});
 var html='<div class="card"><h1>Intelligentietest</h1><div class="score '+(pass===tests.length?'ok':'bad')+'">'+pass+' / '+tests.length+'</div><b>'+ (pass===tests.length?'Alle richtingstests geslaagd':'Niet alle richtingstests geslaagd') +'</b></div>';
 tests.forEach(function(t){html+='<div class="card"><b class="'+(t.ok?'ok':'bad')+'">'+(t.ok?'PASS':'FAIL')+'</b> · '+t.name+(t.msg?'<div class="small">'+t.msg+'</div>':'')+'</div>'});
 document.getElementById('metaSummary').innerHTML=html;
 document.getElementById('metaSummary').scrollIntoView({behavior:'smooth'});
};
document.getElementById('run').onclick=function(){
 var total=0,failed=0,groupHtml='';
 fam.forEach(function(f){
   var gf=0,first=[];
   for(var k=0;k<100;k++){
     total++;
     var input=f.make(k),a=GeldcheckEngine.analyze(input),errs=[];
     try{f.check(a,errs)}catch(err){errs.push(String(err))}
     if(errs.length){failed++;gf++;if(first.length<3)first.push('v'+(k+1)+': '+errs.join(', '))}
   }
   groupHtml+='<div class="card"><b>'+f.name+'</b><div class="small '+(gf?'fail':'')+'">'+(gf?gf+' / 100 fout':'100 / 100 geslaagd')+'</div>'+(first.length?'<div class="small">'+first.join('<br>')+'</div>':'')+'</div>';
 });
 document.getElementById('summary').innerHTML='<div class="score '+(failed?'bad':'ok')+'">'+(total-failed)+' / '+total+'</div><b>'+(failed?failed+' scenario’s vragen aandacht':'Alle 1500 scenario’s inhoudelijk geslaagd')+'</b><div class="grid"><div class="stat"><b>'+fam.length+'</b><span>financiële families</span></div><div class="stat"><b>100</b><span>varianten per familie</span></div></div>';
 document.getElementById('groups').innerHTML=groupHtml;
};
})();
</script></body></html>
