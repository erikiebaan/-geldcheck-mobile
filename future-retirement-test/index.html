<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Retirement Bridge Test</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;margin:0;padding:22px;color:#111}main{max-width:800px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:24px;padding:22px;margin-bottom:14px}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}.score{font-size:54px;font-weight:900}.ok{color:#19765f}.bad{color:#a33}.small{font-size:12px;color:#777}</style></head><body><main>
<div class="card"><h1>Future × Pensioen Bridge</h1><p>Test of toekomstig vermogen pas meetelt wanneer het beschikbaar én bruikbaar is.</p><p class="small"><b>Build FP1 · 24 integratietests · nog niet live gekoppeld</b></p><button id="run">Run 24 Future × Pensioen tests</button><div id="sum"></div></div><div id="out"></div></main>
<script src="../engine.js?v=1.2"></script><script src="../future_layer.js?v=0.1"></script><script src="../future_bridge.js?v=0.1"></script>
<script>
(function(){
var base={age:55,goal:"early",income:5000,cost:3500,cash:50000,investments:450000,retireAge:55,aow:1600,aowStartAge:67,pension:600,pensionStartAge:67};
var T=[];function add(n,f,fn){T.push([n,f,fn])}
function sim(f,o){return GeldcheckFutureBridge.simulate(base,f,o||{mode:"conservative",nominalReturn:.03,crashAtRetirement:true})}
add("Banksparen op 65 niet als vrije cash",{assets:[{id:"bs",name:"Banksparen",type:"blocked_asset",currentValue:300000,availableFromAge:65,certainty:"contractual",liquidity:"restricted",restricted:true}]},r=>r.consumed.indexOf("bs")<0);
add("Banksparen vóór 65 nooit gebruikt",{assets:[{id:"bs",name:"Banksparen",type:"blocked_asset",currentValue:300000,availableFromAge:65,certainty:"contractual",liquidity:"restricted",restricted:true}]},r=>r.ledger.filter(x=>x.age<65).every(x=>x.injected===0));
add("Vrij bedrag op 65 pas vanaf 65",{events:[{id:"gift",name:"Schenking",type:"future_lump_sum",amount:200000,availableFromAge:65,certainty:"certain",liquidity:"immediate"}]},r=>r.ledger.filter(x=>x.age<65).every(x=>x.injected===0)&&r.ledger.some(x=>x.age===65&&x.injected===200000));
add("Zekere schenking verbetert eindkapitaal",{events:[{id:"gift",name:"Schenking",type:"future_lump_sum",amount:200000,availableFromAge:65,certainty:"certain",liquidity:"immediate"}]},r=>r.endCapital>sim({}).endCapital);
add("Onzekere erfenis telt conservatief niet mee",{events:[{id:"erf",name:"Erfenis",type:"uncertain_asset",amount:500000,availableFromAge:70,certainty:"uncertain",liquidity:"months"}]},r=>r.consumed.indexOf("erf")<0&&Math.abs(r.endCapital-sim({}).endCapital)<1);
add("Waarschijnlijke erfenis telt base niet als zeker",{events:[{id:"erf",name:"Erfenis",type:"uncertain_asset",amount:500000,availableFromAge:70,certainty:"probable",liquidity:"months"}]},r=>GeldcheckFutureBridge.simulate(base,{events:[{id:"erf",name:"Erfenis",type:"uncertain_asset",amount:500000,availableFromAge:70,certainty:"probable",liquidity:"months"}]},{mode:"base",nominalReturn:.05,crashAtRetirement:false}).consumed.indexOf("erf")<0);
add("Overwaarde woning niet geconsumeerd",{assets:[{id:"home",name:"Overwaarde",type:"illiquid_property",currentValue:800000,certainty:"certain",liquidity:"illiquid"}]},r=>r.consumed.indexOf("home")<0);
add("Bedrijfsverkoop op 60 pas op 60",{events:[{id:"biz",name:"BV verkoop",type:"future_lump_sum",amount:1000000,availableFromAge:60,certainty:"certain",liquidity:"months"}]},r=>r.ledger.filter(x=>x.age<60).every(x=>x.injected===0)&&r.ledger.some(x=>x.age===60&&x.injected>0));
add("Belasting op bedrijfsverkoop toegepast",{events:[{id:"biz",name:"BV verkoop",type:"future_lump_sum",amount:1000000,availableFromAge:60,certainty:"certain",liquidity:"months",taxable:true,taxRate:.25}]},r=>r.ledger.some(x=>x.age===60&&x.injected===750000));
add("Lijfrente start 65",{events:[{id:"lij",name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual",liquidity:"immediate"}]},r=>r.ledger.filter(x=>x.age<65).every(x=>x.extraIncome===0)&&r.ledger.some(x=>x.age===65&&x.extraIncome>0));
add("Lijfrente stopt na 85",{events:[{id:"lij",name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual",liquidity:"immediate"}]},r=>r.ledger.filter(x=>x.age>85).every(x=>x.extraIncome===0));
add("Lijfrente verbetert pensioenpad",{events:[{id:"lij",name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual",liquidity:"immediate"}]},r=>r.endCapital>sim({}).endCapital);
add("Toekomstige zorgkosten verhogen behoefte",{events:[{id:"zorg",name:"Zorg",type:"future_expense",monthlyAmount:1500,availableFromAge:80,endAge:95,certainty:"certain"}]},r=>r.ledger.some(x=>x.age===80&&x.extraExpense===18000));
add("Toekomstige zorgkosten verslechteren pad",{events:[{id:"zorg",name:"Zorg",type:"future_expense",monthlyAmount:1500,availableFromAge:80,endAge:95,certainty:"certain"}]},r=>r.endCapital<sim({}).endCapital||(!r.success&&sim({}).success));
add("Niet bruikbaar vermogen nooit inzetten",{assets:[{id:"trust",name:"Trust",type:"future_lump_sum",currentValue:900000,availableFromAge:60,certainty:"certain",liquidity:"immediate",usableForGoals:false}]},r=>r.consumed.indexOf("trust")<0);
add("Restricted blijft buiten consumptie",{assets:[{id:"lock",name:"Geblokkeerd",type:"blocked_asset",currentValue:200000,availableFromAge:60,certainty:"certain",liquidity:"restricted",restricted:true}]},r=>r.consumed.indexOf("lock")<0);
add("Twee zekere ontvangsten beide één keer",{events:[{id:"a",name:"A",type:"future_lump_sum",amount:50000,availableFromAge:60,certainty:"certain",liquidity:"immediate"},{id:"b",name:"B",type:"future_lump_sum",amount:70000,availableFromAge:62,certainty:"certain",liquidity:"immediate"}]},r=>r.consumed.length===2&&r.ledger.reduce((s,x)=>s+x.injected,0)===120000);
add("Ontvangst niet dubbel geteld",{events:[{id:"a",name:"A",type:"future_lump_sum",amount:50000,availableFromAge:60,certainty:"certain",liquidity:"immediate"}]},r=>r.ledger.reduce((s,x)=>s+x.injected,0)===50000);
add("Levenslang inkomen vanaf 67",{events:[{id:"life",name:"Uitkering",type:"lifetime_income",monthlyAmount:1000,availableFromAge:67,certainty:"contractual"}]},r=>r.ledger.filter(x=>x.age>=67).every(x=>x.extraIncome>=11400));
add("Inkomen vóór start nul",{events:[{id:"life",name:"Uitkering",type:"lifetime_income",monthlyAmount:1000,availableFromAge:67,certainty:"contractual"}]},r=>r.ledger.filter(x=>x.age<67).every(x=>x.extraIncome===0));
add("Combi banksparen + erfenis + lijfrente veilig gescheiden",{assets:[{id:"bs",name:"Banksparen",type:"blocked_asset",currentValue:300000,availableFromAge:65,certainty:"contractual",liquidity:"restricted",restricted:true}],events:[{id:"erf",name:"Erfenis",type:"uncertain_asset",amount:400000,availableFromAge:70,certainty:"uncertain",liquidity:"months"},{id:"lij",name:"Lijfrente",type:"temporary_income",monthlyAmount:1800,availableFromAge:65,endAge:85,certainty:"contractual"}]},r=>r.consumed.indexOf("bs")<0&&r.consumed.indexOf("erf")<0&&r.ledger.some(x=>x.age===65&&x.extraIncome>0));
add("Crash blijft actief ondanks toekomstige ontvangst",{events:[{id:"gift",name:"Schenking",type:"future_lump_sum",amount:300000,availableFromAge:70,certainty:"certain",liquidity:"immediate"}]},r=>r.ledger[0]&&r.invested>=0);
add("Geen future layer = deterministische baseline",{},r=>Math.abs(r.endCapital-sim({}).endCapital)<1);
add("Base en conservative zijn apart",{events:[{id:"g",name:"Gift",type:"future_lump_sum",amount:100000,availableFromAge:65,certainty:"certain",liquidity:"immediate"}]},r=>{var x=GeldcheckFutureBridge.compare(base,{events:[{id:"g",name:"Gift",type:"future_lump_sum",amount:100000,availableFromAge:65,certainty:"certain",liquidity:"immediate"}]});return x.base.endCapital!==x.conservative.endCapital});

document.getElementById("run").onclick=function(){var pass=0,html="";T.forEach(function(t){var errs=[];try{var r=sim(t[1]);if(!t[2](r))errs.push("verwachting niet gehaald")}catch(e){errs.push(String(e))}if(!errs.length)pass++;html+='<div class="card"><b class="'+(!errs.length?'ok':'bad')+'">'+(!errs.length?'PASS':'FAIL')+'</b> · '+t[0]+(errs.length?'<div class="small">'+errs.join(" · ")+'</div>':'')+'</div>'});document.getElementById("sum").innerHTML='<div class="score '+(pass===T.length?'ok':'bad')+'">'+pass+' / '+T.length+'</div><b>'+(pass===T.length?'Future × Pensioen koppeling groen':'Koppeling bevat fouten')+'</b>';document.getElementById("out").innerHTML=html};
})();
</script></body></html>
