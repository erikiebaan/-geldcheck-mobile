<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Layer Test</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;margin:0;padding:22px;color:#111}main{max-width:780px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:24px;padding:22px;margin-bottom:14px}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}.score{font-size:52px;font-weight:900}.ok{color:#19765f}.bad{color:#a33}.small{font-size:12px;color:#777}</style></head><body><main>
<div class="card"><h1>Future Assets Layer</h1><p>Los van de gevalideerde Geldcheck-engine. Test timing, liquiditeit, zekerheid en beperkingen van huidig en toekomstig vermogen.</p><p class="small"><b>Build FL1 · 30 architectuurtests</b></p><button id="run">Run 30 Future Layer tests</button><div id="sum"></div></div><div id="out"></div></main>
<script src="../future_layer.js?v=0.1"></script><script>
(function(){
function ok(cond,msg,a){if(!cond)a.push(msg)}
function runCase(name,raw,fn){var errs=[];try{fn(GeldcheckFutureLayer.normalize(raw),errs)}catch(e){errs.push(String(e))}return {name:name,errs:errs}}
var tests=[];
function add(n,r,f){tests.push([n,r,f])}
var currentAge=55;
add("Banksparen niet vrij op 55",{currentAge,assets:[{name:"Banksparen",type:"blocked_asset",currentValue:300000,availableFromAge:65,certainty:"contractual",liquidity:"restricted",restricted:true}]},function(m,e){var x=GeldcheckFutureLayer.classifyAt(m,55);ok(x.availableNow===0,"banksparen onterecht vrij",e)});
add("Banksparen blijft geblokkeerd op 65",{currentAge,assets:[{name:"Banksparen",type:"blocked_asset",currentValue:300000,availableFromAge:65,certainty:"contractual",liquidity:"restricted",restricted:true}]},function(m,e){var x=GeldcheckFutureLayer.classifyAt(m,65);ok(x.blocked===300000,"blocked waarde fout",e);ok(x.availableNow===0,"restricted als cash gezien",e)});
add("Erfenis voor datum telt niet mee",{currentAge,events:[{name:"Erfenis",type:"uncertain_asset",amount:400000,availableFromAge:70,certainty:"uncertain",liquidity:"months"}]},function(m,e){var x=GeldcheckFutureLayer.classifyAt(m,60);ok(x.availableNow===0,"erfenis te vroeg gebruikt",e);ok(x.futureWeighted>0,"toekomstscenario ontbreekt",e)});
add("Erfenis onzeker blijft gewogen",{currentAge,events:[{name:"Erfenis",type:"uncertain_asset",amount:400000,availableFromAge:70,certainty:"uncertain",liquidity:"months"}]},function(m,e){var x=GeldcheckFutureLayer.classifyAt(m,70);ok(x.availableWeighted<400000,"onzekere erfenis als zeker behandeld",e)});
add("Overwaarde niet als cash",{currentAge,assets:[{name:"Woning",type:"illiquid_property",currentValue:800000,certainty:"certain",liquidity:"illiquid"}]},function(m,e){var x=GeldcheckFutureLayer.classifyAt(m,55);ok(x.availableNow===0,"overwaarde als cash gezien",e);ok(x.illiquid===800000,"illiquide waarde mist",e)});
add("Vrij spaargeld wel cash",{currentAge,assets:[{name:"Cash",type:"liquid_cash",currentValue:50000,certainty:"certain",liquidity:"immediate"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,55).availableNow===50000,"cash niet beschikbaar",e)});
add("Vrije beleggingen dagen liquide",{currentAge,assets:[{name:"ETF",type:"liquid_investment",currentValue:100000,certainty:"certain",liquidity:"days"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,55).availableNow===100000,"ETF niet beschikbaar",e)});
add("Bedrijfsverkoop voor 60 niet inzetbaar",{currentAge,events:[{name:"BV verkoop",type:"future_lump_sum",amount:1000000,availableFromAge:60,certainty:"probable",liquidity:"months"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,59).availableNow===0,"verkoop te vroeg gebruikt",e)});
add("Belasting verlaagt toekomstige netto ontvangst",{currentAge,events:[{name:"BV verkoop",type:"future_lump_sum",amount:1000000,availableFromAge:60,certainty:"certain",liquidity:"months",taxable:true,taxRate:.25}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,60).items[0].base===750000,"netto bedrag fout",e)});
add("Lijfrente vóór start geen inkomen",{currentAge,events:[{name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,64).monthlyIncome===0,"inkomen te vroeg",e)});
add("Lijfrente tijdens looptijd inkomen",{currentAge,events:[{name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,70).monthlyIncome>1800,"inkomen niet herkend",e)});
add("Lijfrente na eindleeftijd stopt",{currentAge,events:[{name:"Lijfrente",type:"temporary_income",monthlyAmount:2000,availableFromAge:65,endAge:85,certainty:"contractual"}]},function(m,e){ok(GeldcheckFutureLayer.classifyAt(m,86).monthlyIncome===0,"tijdelijk inkomen loopt door",e)});
for(var i=0;i<18;i++)add("Timing invariant "+(i+1),{currentAge:40,events:[{name:"Event",type:"future_lump_sum",amount:10000+i*1000,availableFromAge:60+i%5,certainty:i%2?"contractual":"uncertain",liquidity:i%3?"months":"restricted",restricted:i%3===0}]},function(m,e){var ev=m.events[0],pre=GeldcheckFutureLayer.classifyAt(m,ev.availableFromAge-1),post=GeldcheckFutureLayer.classifyAt(m,ev.availableFromAge);ok(pre.items[0].available===false,"event te vroeg beschikbaar",e);ok(post.items[0].available===true,"event niet op tijd beschikbaar",e)});
document.getElementById("run").onclick=function(){var pass=0,html="";tests.forEach(function(t){var r=runCase(t[0],t[1],t[2]);if(!r.errs.length)pass++;html+='<div class="card"><b class="'+(!r.errs.length?'ok':'bad')+'">'+(!r.errs.length?'PASS':'FAIL')+'</b> · '+r.name+(r.errs.length?'<div class="small">'+r.errs.join(" · ")+'</div>':'')+'</div>'});document.getElementById("sum").innerHTML='<div class="score '+(pass===tests.length?'ok':'bad')+'">'+pass+' / '+tests.length+'</div><b>'+(pass===tests.length?'Future Layer architectuur groen':'Future Layer bevat fouten')+'</b>';document.getElementById("out").innerHTML=html};
})();
</script></body></html>
