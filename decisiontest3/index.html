<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geldcheck Beslissingstest</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;color:#111;margin:0;padding:22px}main{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin-bottom:14px}h1{font-size:38px;line-height:1.02;margin:0 0 10px}p{color:#777;line-height:1.45}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}.score{font-size:52px;font-weight:900;margin:18px 0 2px}.ok{color:#19765f}.bad{color:#a33}.small{font-size:12px;color:#777}.row{padding:10px 0;border-top:1px solid #eee}</style></head><body><main>
<div class="card"><h1>Beslissingstest 25</h1><p>25 paren. Per paar verandert één relevante variabele. De Geldcheck moet aantoonbaar in de financieel juiste richting bewegen.</p><p class="small"><b>Build D3 · nieuwe route</b></p><button id="run" onclick="document.getElementById('summary').innerHTML='<div class=&quot;small&quot; style=&quot;margin-top:16px&quot;>Knop werkt · tests draaien…</div>';">Run 25 beslissingstests</button><div id="summary"></div></div><div id="results"></div></main>
<script src="../engine.js?v=1.2.1"></script><script>
(function(){
var tests=[];
function A(x){return GeldcheckEngine.analyze(x)}
function add(name,a,b,check,expect){tests.push({name:name,a:a,b:b,check:check,expect:expect})}
var base={age:45,goal:'health',income:5000,cost:3500,cash:25000,investments:150000,debt:0,annualIncluded:true};
add('Meer cash',base,Object.assign({},base,{cash:100000}),function(a,b){return b.score.value>=a.score.value&&b.dimensions.liquidity.bufferMonths>a.dimensions.liquidity.bufferMonths},'positie mag niet verslechteren');
add('Minder cash',base,Object.assign({},base,{cash:1000}),function(a,b){return b.dimensions.liquidity.bufferMonths<a.dimensions.liquidity.bufferMonths&&b.score.value<=a.score.value},'liquiditeit moet slechter');
add('Meer inkomen',base,Object.assign({},base,{income:7000}),function(a,b){return b.case.monthlySurplus>a.case.monthlySurplus&&b.score.value>=a.score.value},'maandruimte omhoog');
add('Minder inkomen',base,Object.assign({},base,{income:3800}),function(a,b){return b.case.monthlySurplus<a.case.monthlySurplus&&b.score.value<=a.score.value},'maandruimte omlaag');
add('Lagere uitgaven',base,Object.assign({},base,{cost:2500}),function(a,b){return b.case.monthlySurplus>a.case.monthlySurplus&&b.score.value>=a.score.value},'positie beter');
add('Hogere uitgaven',base,Object.assign({},base,{cost:5200}),function(a,b){return b.case.monthlySurplus<a.case.monthlySurplus&&b.score.value<a.score.value},'positie slechter');
add('Dure schuld toegevoegd',base,Object.assign({},base,{debt:100000,debtRate:.09}),function(a,b){return b.dimensions.debt.highInterest&&b.score.value<a.score.value},'risico omhoog');
add('Meer beleggingen',base,Object.assign({},base,{investments:750000}),function(a,b){return b.dimensions.wealth.runwayMonths>a.dimensions.wealth.runwayMonths&&b.score.value>=a.score.value},'draagkracht omhoog');
var early={age:55,goal:'early',income:5000,cost:3600,cash:5000,investments:1200000,debt:0,retireAge:55,aow:1400,aowStartAge:67,pension:500,pensionStartAge:67,annualIncluded:true};
add('Stoppen later: 55→60',early,Object.assign({},early,{retireAge:60}),function(a,b){return b.decision&&a.decision&&(!a.decision.conservative.success||b.decision.conservative.endCapital>=a.decision.conservative.endCapital)},'later stoppen mag niet slechter');
add('Meer vermogen bij vroeg stoppen',early,Object.assign({},early,{investments:1600000}),function(a,b){return b.decision.conservative.endCapital>a.decision.conservative.endCapital||(!a.decision.conservative.success&&b.decision.conservative.success)},'pensioenrobuustheid omhoog');
add('Minder vermogen bij vroeg stoppen',early,Object.assign({},early,{investments:600000}),function(a,b){return !b.decision.conservative.success||b.decision.conservative.endCapital<a.decision.conservative.endCapital},'pensioenrobuustheid omlaag');
add('Lagere uitgaven bij vroeg stoppen',early,Object.assign({},early,{cost:2800}),function(a,b){return b.decision.conservative.endCapital>a.decision.conservative.endCapital||(!a.decision.conservative.success&&b.decision.conservative.success)},'haalbaarheid beter');
add('Hogere uitgaven bij vroeg stoppen',early,Object.assign({},early,{cost:5000}),function(a,b){return !b.decision.conservative.success||b.decision.conservative.endCapital<a.decision.conservative.endCapital},'haalbaarheid slechter');
add('Meer AOW',early,Object.assign({},early,{aow:2000}),function(a,b){return b.decision.conservative.endCapital>=a.decision.conservative.endCapital},'latere onttrekking lager');
add('Meer pensioen',early,Object.assign({},early,{pension:1500}),function(a,b){return b.decision.conservative.endCapital>=a.decision.conservative.endCapital},'latere onttrekking lager');
add('AOW later',early,Object.assign({},early,{aowStartAge:70}),function(a,b){return b.decision.conservative.endCapital<=a.decision.conservative.endCapital},'brug zwaarder');
add('Pensioen later',early,Object.assign({},early,{pensionStartAge:70}),function(a,b){return b.decision.conservative.endCapital<=a.decision.conservative.endCapital},'brug zwaarder');
var purchase={age:40,goal:'purchase',income:6000,cost:3500,cash:80000,investments:100000,debt:0,purchaseAmount:25000,purchaseMonths:24,annualIncluded:true};
add('Aankoop duurder',purchase,Object.assign({},purchase,{purchaseAmount:50000}),function(a,b){return b.scenarios.purchase.monthlyReserve>a.scenarios.purchase.monthlyReserve&&b.scenarios.purchase.bufferMonthsAfter<a.scenarios.purchase.bufferMonthsAfter},'druk omhoog');
add('Meer tijd voor aankoop',purchase,Object.assign({},purchase,{purchaseMonths:48}),function(a,b){return b.scenarios.purchase.monthlyReserve<a.scenarios.purchase.monthlyReserve},'maanddruk omlaag');
var cf={age:40,goal:'cashflow',income:6000,cost:4000,cash:30000,investments:50000,debt:0,annualIncluded:false,savingGrowth:500};
add('Werkelijke spaargroei dichter bij papier',cf,Object.assign({},cf,{savingGrowth:1900}),function(a,b){return Math.abs(b.scenarios.reconciliation.gap)<Math.abs(a.scenarios.reconciliation.gap)},'onverklaard gat kleiner');
add('Werkelijke spaargroei verder van papier',cf,Object.assign({},cf,{savingGrowth:0}),function(a,b){return Math.abs(b.scenarios.reconciliation.gap)>Math.abs(a.scenarios.reconciliation.gap)},'onverklaard gat groter');
add('Inkomen ontbreekt',base,Object.assign({},base,{income:null}),function(a,b){return a.score.value!==null&&b.score.value===null},'geen schijnscore');
add('Uitgaven ontbreken',base,Object.assign({},base,{cost:null}),function(a,b){return a.score.value!==null&&b.score.value===null},'geen schijnscore');
add('Leeftijd alleen verandert huidige cashflow niet',base,Object.assign({},base,{age:70}),function(a,b){return a.case.monthlySurplus===b.case.monthlySurplus},'irrelevante dimensie stabiel');
add('Huishoudlabel alleen verandert rekensom niet',base,Object.assign({},base,{household:'couple'}),function(a,b){return a.case.monthlySurplus===b.case.monthlySurplus&&a.score.value===b.score.value},'geen willekeurige verandering');

document.getElementById('run').addEventListener('click',function(){try{var pass=0,html='';tests.forEach(function(t,i){var a=A(t.a),b=A(t.b),ok=false,msg='';try{ok=t.check(a,b)}catch(e){msg=String(e)}if(ok)pass++;html+='<div class="card row"><b class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+'</b> · '+(i+1)+'. '+t.name+'<div class="small">'+t.expect+(msg?' · '+msg:'')+'</div></div>'});document.getElementById('summary').innerHTML='<div class="score '+(pass===tests.length?'ok':'bad')+'">'+pass+' / '+tests.length+'</div><b>'+(pass===tests.length?'Alle beslissingen bewegen logisch':'Er zijn echte beslisfouten gevonden')+'</b>';document.getElementById('results').innerHTML=html}catch(err){document.getElementById('summary').innerHTML='<div class="score bad">JS FOUT</div><div class="small">'+String(err)+'</div>'}});
if(typeof GeldcheckEngine==='undefined'){document.getElementById('summary').innerHTML='<div class="bad" style="margin-top:18px;font-weight:800">Engine kon niet laden. Ververs deze pagina.</div>'}
})();
</script></body></html>
