<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Cases 16</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;color:#111;margin:0;padding:22px}main{max-width:820px;margin:auto}.card,.case{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin-bottom:14px}h1{font-size:42px;line-height:1.02;margin:0 0 12px}p,.why{color:#777;line-height:1.45}.small,.why{font-size:13px}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}.score{font-size:56px;font-weight:900;margin:18px 0 2px}.ok{color:#19765f}.bad{color:#b43131}.exp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#666;margin-top:6px}</style></head><body><main>
<div class="card"><h1>Golden Cases 16</h1><p>Zestien complete huishoudens met handmatig narekenbare uitkomsten. Geen alleen-richtingstest: bedragen, leeftijden, funding gaps en ontvangstmomenten moeten exact verklaarbaar zijn.</p><p class="small"><b>Build G2 · 16 handmatig narekenbare referentiecases · exacte ledgerwaarden</b></p><button id="run">Run 16 Golden Cases</button><div id="sum"></div></div><div id="out"></div></main>
<script src="../engine.js?v=1.2"></script><script src="../future_layer.js?v=0.1"></script><script src="../future_bridge.js?v=0.5"></script>
<script>
(function(){"use strict";
const B=o=>Object.assign({age:60,goal:"early",income:3000,cost:3000,cash:0,investments:0,retireAge:60,aow:0,aowStartAge:67,pension:0,pensionStartAge:67},o||{});
const S=(c,f,o)=>GeldcheckFutureBridge.simulate(c,f||{},Object.assign({mode:"conservative",nominalReturn:.02,crashAtRetirement:false,endAge:65},o||{}));
const at=(r,a)=>r.ledger.find(x=>x.age===a), eq=(a,b,t=1)=>Math.abs(a-b)<=t;
const gift=(id,amt,age,taxRate)=>({id,type:"future_lump_sum",amount:amt,availableFromAge:age,certainty:"certain",liquidity:"immediate",taxable:taxRate!==undefined,taxRate:taxRate||0});
const inc=(id,m,age,end,taxRate)=>({id,type:"temporary_income",monthlyAmount:m,availableFromAge:age,endAge:end,certainty:"contractual",liquidity:"immediate",taxable:taxRate!==undefined,taxRate:taxRate||0});
const exp=(id,m,age,end)=>({id,type:"future_expense",monthlyAmount:m,availableFromAge:age,endAge:end,certainty:"certain"});
let T=[]; const add=(n,c,f,check,expect)=>T.push({n,c,f,check,expect});

add("1. Alleen cash, één jaar kosten",B({cash:36000}),{},r=>eq(at(r,60).cash,0)&&eq(r.endCapital,-144000),"€36.000 cash dekt exact jaar 60; jaren 61-64 geven samen €144.000 funding gap.");
add("2. Alleen investments, één jaar kosten",B({investments:36000}),{},r=>eq(at(r,60).invested,0)&&eq(r.endCapital,-144000),"Bij 0% reëel rendement dekt €36.000 exact het eerste jaar.");
add("3. Cash + investments samen",B({cash:12000,investments:24000}),{},r=>eq(at(r,60).cash,0)&&eq(at(r,60).invested,0),"Cash wordt eerst gebruikt, daarna beleggingen; samen exact €36.000.");
add("4. AOW vanaf 62 halveert behoefte",B({cost:2000,aow:1000,aowStartAge:62}),{},r=>eq(at(r,61).need,24000)&&eq(at(r,62).need,12000),"Voor 62: €24k/jaar behoefte; vanaf 62: €12k.");
add("5. Pensioen vanaf 63 dekt alles",B({cost:1000,pension:1000,pensionStartAge:63}),{},r=>eq(at(r,62).need,12000)&&eq(at(r,63).need,0)&&eq(at(r,64).need,0),"Vanaf 63 nul netto behoefte.");
add("6. Gift exact op 62",B({cost:1000}),{events:[gift("g",24000,62)]},r=>eq(at(r,62).injected,24000)&&eq(at(r,62).invested,12000)&&eq(at(r,62).fundingGap,24000)&&eq(at(r,62).netPosition,-12000),"Na €24k historisch tekort komt €24k binnen; na €12k jaarbehoefte is de netto positie -€12k.");
add("7. Gift op 62 met 25% belasting",B({cost:1000}),{events:[gift("g",24000,62,.25)]},r=>eq(at(r,62).injected,18000),"Netto ontvangst exact €18.000.");
add("8. Lijfrente 60-61 €500 p/m",B({cost:1000}),{events:[inc("l",500,60,61)]},r=>eq(at(r,60).extraIncome,6000)&&eq(at(r,61).extraIncome,6000)&&eq(at(r,62).extraIncome,0),"Twee jaren exact €6k inkomen.");
add("9. Lijfrente met 25% belasting",B({cost:1000}),{events:[inc("l",1000,60,60,.25)]},r=>eq(at(r,60).extraIncome,9000)&&eq(at(r,60).need,3000),"€12k bruto → €9k netto; €12k kosten → €3k behoefte.");
add("10. Zorgkosten één jaar",B({cost:1000}),{events:[exp("z",500,61,61)]},r=>eq(at(r,60).need,12000)&&eq(at(r,61).need,18000)&&eq(at(r,62).need,12000),"Alleen jaar 61 €6k extra kosten.");
add("11. Gift + zorgkosten zelfde jaar",B({cost:1000}),{events:[gift("g",12000,61),exp("z",1000,61,61)]},r=>eq(at(r,61).injected,12000)&&eq(at(r,61).need,24000),"In hetzelfde jaar blijven ontvangst en kosten apart zichtbaar.");
add("12. Onzekere erfenis telt niet conservatief",B({cost:1000}),{events:[{id:"e",type:"uncertain_asset",amount:100000,availableFromAge:60,certainty:"uncertain",liquidity:"immediate"}]},r=>eq(at(r,60).injected,0)&&r.consumed.length===0,"Geen voorschot op onzeker vermogen.");
add("13. Locked banksparen blijft buiten cashflow",B({cost:1000}),{assets:[{id:"b",type:"blocked_asset",currentValue:100000,availableFromAge:60,certainty:"contractual",liquidity:"restricted",restricted:true}]},r=>eq(at(r,60).injected,0)&&r.consumed.length===0,"Geblokkeerd vermogen wordt niet gebruikt.");
add("14. Funding gap stapelt exact",B({cost:1000}),{},r=>eq(at(r,60).fundingGap,12000)&&eq(at(r,61).fundingGap,24000)&&eq(at(r,64).fundingGap,60000),"Vijf jaren × €12k = €60k tekort.");
add("15. Pre-retirement sparen twee jaar",B({age:60,retireAge:62,income:4000,cost:3000}),{},r=>eq(at(r,62).invested,0)&&eq(at(r,62).fundingGap,12000)&&r.retireAge===62,"€1.000 p/m surplus gedurende 2 jaar bouwt €24k op; eerste pensioenjaar van €36k laat exact €12k tekort.");
add("16. Baanverlies vóór retirement reduceert opbouw",B({age:60,retireAge:62,income:4000,cost:3000}),{events:[inc("loss",-500,60,61)]},r=>eq(at(r,62).invested,0)&&eq(at(r,62).fundingGap,24000)&&r.retireAge===62,"Door baanverlies daalt opbouw vóór retirement naar €12k; eerste pensioenjaar van €36k laat exact €24k tekort.");

if(T.length!==16){document.body.innerHTML="<pre>TEST COUNT ERROR "+T.length+"</pre>";return}
document.getElementById("run").onclick=()=>{let p=0,h="";
T.forEach((t,i)=>{let ok=false,err="";try{let r=S(t.c,t.f);ok=!!t.check(r)}catch(e){err=String(e)}
if(ok)p++;h+='<div class="case"><b class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+'</b> · '+t.n+'<div class="why">'+t.expect+'</div>'+(err?'<div class="exp">'+err+'</div>':'')+'</div>'});
document.getElementById("sum").innerHTML='<div class="score '+(p===16?'ok':'bad')+'">'+p+' / 16</div><b>'+(p===16?'Alle Golden Cases exact verklaarbaar':'Golden Cases vonden exacte afwijkingen')+'</b>';document.getElementById("out").innerHTML=h};
})();</script></body></html>
