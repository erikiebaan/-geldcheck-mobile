<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geldcheck Future Stress 5000</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;color:#111;margin:0;padding:22px}main{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin-bottom:14px}h1{font-size:42px;line-height:1.02;margin:0 0 12px}p{color:#777;line-height:1.45}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}.score{font-size:56px;font-weight:900;margin:18px 0 2px}.ok{color:#19765f}.bad{color:#b43131}.wait{color:#8a6d00}.small{font-size:13px;color:#777}.bar{height:9px;background:#e6e1d8;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#19765f}.anom{background:#fff;border:1px solid #e4c2c2;border-radius:18px;padding:14px;margin:10px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;color:#666}
</style></head><body><main>
<div class="card"><h1>Future Stress 5.000</h1><p>5.000 willekeurige huishoudens met combinaties van banksparen, erfenis, schenking, vastgoed, bedrijfsverkoop, lijfrente en toekomstige kosten.</p><p class="small"><b>Build FS2 · seed 260906 · per-item timing attribution · bridge v0.3</b></p><button id="run">Run 5.000 Future Stress cases</button><div class="bar"><div class="fill" id="fill"></div></div><div id="sum"></div></div>
<div id="stats"></div><div id="fails"></div>
</main>
<script src="../engine.js?v=1.2"></script>
<script src="../future_layer.js?v=0.1"></script>
<script src="../future_bridge.js?v=0.3"></script>
<script>
(function(){
"use strict";
var N=5000,SEED=260906;
function rng(seed){var x=seed>>>0;return function(){x=(1664525*x+1013904223)>>>0;return x/4294967296}}
var R=rng(SEED);
function ri(a,b){return Math.floor(a+R()*(b-a+1))}
function pick(a){return a[Math.floor(R()*a.length)]}
function chance(p){return R()<p}
function money(a,b){return Math.round((a+R()*(b-a))/100)*100}
function clone(x){return JSON.parse(JSON.stringify(x))}
function baseCase(i){
  var age=ri(40,70), retire=ri(Math.max(age,50),75);
  return {caseId:i,age:age,goal:"early",income:money(2000,12000),cost:money(1800,9000),cash:money(0,400000),investments:money(0,3000000),retireAge:retire,aow:money(800,2500),aowStartAge:ri(67,70),pension:money(0,3500),pensionStartAge:ri(60,72)};
}
function item(id,age){
  var t=pick(["banksparen","inherit","gift","home","business","annuity","care"]);
  if(t==="banksparen")return {id,name:"Banksparen",type:"blocked_asset",currentValue:money(10000,600000),availableFromAge:ri(Math.max(age,55),75),certainty:"contractual",liquidity:"restricted",restricted:true};
  if(t==="inherit")return {id,name:"Erfenis",type:"uncertain_asset",amount:money(10000,1000000),availableFromAge:ri(Math.max(age,50),85),certainty:pick(["uncertain","probable"]),liquidity:"months"};
  if(t==="gift")return {id,name:"Schenking",type:"future_lump_sum",amount:money(5000,500000),availableFromAge:ri(Math.max(age,45),80),certainty:"certain",liquidity:"immediate"};
  if(t==="home")return {id,name:"Overwaarde",type:"illiquid_property",currentValue:money(50000,1200000),certainty:"certain",liquidity:"illiquid"};
  if(t==="business")return {id,name:"Bedrijfsverkoop",type:"future_lump_sum",amount:money(50000,2000000),availableFromAge:ri(Math.max(age,45),80),certainty:pick(["certain","probable"]),liquidity:"months",taxable:true,taxRate:pick([.15,.20,.25,.30])};
  if(t==="annuity")return {id,name:"Lijfrente",type:"temporary_income",monthlyAmount:money(250,5000),availableFromAge:ri(Math.max(age,55),75),endAge:ri(76,95),certainty:"contractual",liquidity:"immediate",taxable:true,taxRate:pick([0,.15,.20,.25])};
  return {id,name:"Zorgkosten",type:"future_expense",monthlyAmount:money(250,4000),availableFromAge:ri(Math.max(age,60),90),endAge:95,certainty:"certain"};
}
function futureFor(c){
  var assets=[],events=[],n=ri(0,6);
  for(var i=0;i<n;i++){var x=item("i"+c.caseId+"_"+i,c.age);(["blocked_asset","illiquid_property"].includes(x.type)?assets:events).push(x)}
  return {currentAge:c.age,assets:assets,events:events};
}
function addFail(arr,code,msg,c,f){if(arr.length<80)arr.push({code:code,msg:msg,caseId:c.caseId,raw:c,future:f})}
function checks(c,f){
  var fails=[];
  var cons=GeldcheckFutureBridge.simulate(c,f,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
  var base=GeldcheckFutureBridge.simulate(c,f,{mode:"base",nominalReturn:.05,crashAtRetirement:false});
  if(base.endCapital<cons.endCapital-1)addFail(fails,"base-vs-cons","Basisscenario eindigt slechter dan conservatief",c,f);

  var empty=GeldcheckFutureBridge.simulate(c,{}, {mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
  var certainLumps=[].concat(f.events||[]).filter(x=>x.type==="future_lump_sum"&&x.certainty==="certain");
  if(certainLumps.length){
    var f2=clone(f);f2.events=(f2.events||[]).filter(x=>!(x.type==="future_lump_sum"&&x.certainty==="certain"));
    var noGift=GeldcheckFutureBridge.simulate(c,f2,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
    if(cons.endCapital<noGift.endCapital-1)addFail(fails,"certain-lump","Zekere toekomstige ontvangst verslechtert eindpositie",c,f);
  }

  var uncertain=(f.events||[]).filter(x=>x.certainty==="uncertain");
  if(uncertain.length){
    var f3=clone(f);f3.events=(f3.events||[]).filter(x=>x.certainty!=="uncertain");
    var noUnc=GeldcheckFutureBridge.simulate(c,f3,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
    if(Math.abs(cons.endCapital-noUnc.endCapital)>1)addFail(fails,"uncertain-leak","Onzekere erfenis beïnvloedt conservatief scenario",c,f);
  }

  var blocked=(f.assets||[]).filter(x=>x.restricted||x.liquidity==="restricted"||x.liquidity==="illiquid");
  blocked.forEach(x=>{if(cons.consumed.indexOf(x.id)>=0)addFail(fails,"restricted-consume","Geblokkeerd/illiquide vermogen is geconsumeerd",c,f)});

  var anns=(f.events||[]).filter(x=>x.type==="temporary_income"||x.type==="lifetime_income");
  anns.forEach(x=>{
    /* Attribute timing to this specific income stream. Aggregate extraIncome can
       legitimately be non-zero because another annuity may already be active. */
    var fNo=clone(f);
    fNo.events=(fNo.events||[]).filter(y=>y.id!==x.id);
    var noX=GeldcheckFutureBridge.simulate(c,fNo,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
    var byAge={};noX.ledger.forEach(r=>byAge[r.age]=r);
    var before=cons.ledger.filter(r=>r.age<x.availableFromAge);
    if(before.some(r=>Math.abs(r.extraIncome-((byAge[r.age]&&byAge[r.age].extraIncome)||0))>1))
      addFail(fails,"income-early","Deze inkomstenstroom beïnvloedt het pad vóór de startleeftijd",c,f);
    if(x.endAge){
      var after=cons.ledger.filter(r=>r.age>x.endAge);
      if(after.some(r=>Math.abs(r.extraIncome-((byAge[r.age]&&byAge[r.age].extraIncome)||0))>1))
        addFail(fails,"income-late","Deze tijdelijke inkomstenstroom beïnvloedt het pad na de eindleeftijd",c,f);
    }
  });

  var expenses=(f.events||[]).filter(x=>x.type==="future_expense");
  if(expenses.length){
    var f4=clone(f);f4.events=(f4.events||[]).filter(x=>x.type!=="future_expense");
    var noExp=GeldcheckFutureBridge.simulate(c,f4,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
    if(cons.endCapital>noExp.endCapital+1)addFail(fails,"expense-improves","Toekomstige kosten verbeteren pensioenpad",c,f);
  }

  var gifts=(f.events||[]).filter(x=>x.type==="future_lump_sum"&&x.certainty==="certain");
  gifts.forEach(x=>{
    /* Compare against the identical household without this one lump sum.
       Other earlier lump sums are allowed and must not create a false FAIL. */
    var fNo=clone(f);
    fNo.events=(fNo.events||[]).filter(y=>y.id!==x.id);
    var noX=GeldcheckFutureBridge.simulate(c,fNo,{mode:"conservative",nominalReturn:.03,crashAtRetirement:true});
    var byAge={};noX.ledger.forEach(r=>byAge[r.age]=r);
    var pre=cons.ledger.filter(r=>r.age<x.availableFromAge);
    if(pre.some(r=>Math.abs(r.injected-((byAge[r.age]&&byAge[r.age].injected)||0))>1))
      addFail(fails,"lump-early","Deze eenmalige ontvangst beïnvloedt het pad vóór de beschikbaarheidsleeftijd",c,f);
  });

  if(cons.fundingGap<0||base.fundingGap<0)addFail(fails,"gap-negative","Funding gap is negatief",c,f);
  if(cons.success&&cons.failedAge!==null)addFail(fails,"state","success en failedAge tegelijk",c,f);
  if(!cons.success&&cons.failedAge===null)addFail(fails,"state2","failure zonder failedAge",c,f);
  return fails;
}
var running=false;
document.getElementById("run").onclick=function(){
 if(running)return;running=true;R=rng(SEED);
 var i=0,clean=0,all=[],cats={};
 document.getElementById("sum").innerHTML='<div class="score wait">0 / '+N+'</div><b>Future Layer onder zware combinatiestress…</b>';
 document.getElementById("fails").innerHTML='';document.getElementById("fill").style.width="0%";
 function chunk(){
  var stop=Math.min(N,i+50);
  for(;i<stop;i++){
    var c=baseCase(i+1),f=futureFor(c),ff=[];
    try{ff=checks(c,f)}catch(e){ff=[{code:"runtime",msg:String(e),caseId:c.caseId,raw:c,future:f}]}
    if(ff.length===0)clean++;else ff.forEach(x=>{cats[x.code]=(cats[x.code]||0)+1;if(all.length<80)all.push(x)});
  }
  document.getElementById("fill").style.width=Math.round(i/N*100)+"%";
  document.getElementById("sum").innerHTML='<div class="score '+(i===N?(clean===N?"ok":"bad"):"wait")+'">'+clean+' / '+N+'</div><b>'+(i===N?(clean===N?"0 anomalieën · Future Stress groen":(N-clean)+" cases vragen aandacht"):"Getest "+i+" van "+N)+'</b>';
  if(i<N)setTimeout(chunk,0); else {
    var keys=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
    document.getElementById("stats").innerHTML='<div class="card"><b>Anomaliecategorieën</b><p class="small">'+(keys.length?keys.map(k=>k+": "+cats[k]).join(" · "):"Geen anomalieën gevonden.")+'</p></div>';
    document.getElementById("fails").innerHTML=all.map(x=>'<div class="anom"><b>'+x.code+' · case '+x.caseId+'</b><div>'+x.msg+'</div><div class="mono">'+JSON.stringify({case:x.raw,future:x.future},null,2)+'</div></div>').join("");
    running=false;
  }
 }
 chunk();
};
})();
</script></body></html>
