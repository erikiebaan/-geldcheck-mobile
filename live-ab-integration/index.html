<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Integration A/B</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;margin:0;padding:22px;color:#111}main{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin:0 0 14px}h1{font-size:43px;line-height:1;margin:0 0 14px}p{color:#777;line-height:1.45}.small{font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #ddd7ca;border-radius:18px;padding:15px}.box b{display:block;font-size:18px}.big{font-size:44px;font-weight:900}.g{color:#19765f}.r{color:#b43131}button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><main>
<div class="card"><h1>Echte Geldcheck<br>A/B Integratie</h1><p>Dezelfde invoer gaat eerst door de bestaande Geldcheck en daarna door de Future Bridge. De basismotor mag niet veranderen; Future mag alleen aantoonbaar nieuwe toekomstinformatie toevoegen.</p><p class="small">Build AB1 · Engine v1.2 ongemoeid · Future geïsoleerd · bridge v0.3</p><button id="run">Run echte Geldcheck A/B</button><div id="sum"></div></div><div id="out"></div>
<script src="../engine.js?v=1.2"></script><script src="../future_layer.js?v=0.1"></script><script src="../future_bridge.js?v=0.5"></script><script>
(function(){
const cases=[
["Vroege stopper", {age:60,household:"Alleen",kids:0,goal:"early",income:4000,cost:3000,cash:36000,investments:240000,debt:0,retireAge:62,aow:1400,aowStartAge:67,pension:600,pensionStartAge:67}],
["Pensioencheck", {age:64,household:"Samenwonend",kids:0,goal:"retirement",income:4200,cost:3100,cash:50000,investments:180000,debt:0,retireAge:67,aow:1500,aowStartAge:67,pension:1000,pensionStartAge:67}],
["Cashflow", {age:45,household:"Gezin",kids:2,goal:"cashflow",income:5000,cost:4200,cash:25000,investments:30000,debt:0}],
["Gezondheid", {age:55,household:"Samenwonend",kids:0,goal:"health",income:5200,cost:3500,cash:45000,investments:120000,debt:0,retireAge:67,aow:1400,aowStartAge:67,pension:800,pensionStartAge:67}],
["Krap pensioen", {age:61,household:"Alleen",kids:0,goal:"retirement",income:3000,cost:3000,cash:12000,investments:60000,debt:0,retireAge:63,aow:1400,aowStartAge:67,pension:300,pensionStartAge:67}]
];
function snapshot(a){return JSON.stringify({case:a.case,score:a.score,decision:a.decision,missing:a.missing,scenarios:a.scenarios})}
function bridgeInput(x){return {age:x.age,goal:x.goal,income:x.income||0,cost:x.cost||0,cash:x.cash||0,investments:x.investments||0,retireAge:x.retireAge||67,aow:x.aow||0,aowStartAge:x.aowStartAge||67,pension:x.pension||0,pensionStartAge:x.pensionStartAge||67}}
document.getElementById("run").onclick=function(){let pass=0,h="";
cases.forEach((z,i)=>{let name=z[0],x=z[1],ok=false,msg="",future="";
try{let before=GeldcheckEngine.analyze(JSON.parse(JSON.stringify(x)));let snap=snapshot(before);
let fr=GeldcheckFutureBridge.simulate(bridgeInput(x),{}, {mode:"conservative",nominalReturn:.02,crashAtRetirement:false,endAge:95});
let after=GeldcheckEngine.analyze(JSON.parse(JSON.stringify(x)));let unchanged=snap===snapshot(after);
let valid=fr&&Array.isArray(fr.ledger)&&fr.ledger.length>0&&Number.isFinite(fr.endCapital)&&fr.retireAge>=x.age;
ok=unchanged&&valid;future="Future ledger "+fr.ledger.length+" jaar · eindpositie €"+Math.round(fr.endCapital).toLocaleString("nl-NL");
msg=(unchanged?"Basismotor byte-for-byte gelijk":"BASISMOTOR VERANDERDE")+" · "+future;
}catch(e){msg=String(e)} if(ok)pass++;
h+='<div class="card"><b class="'+(ok?'g':'r')+'">'+(ok?'PASS':'FAIL')+' · '+(i+1)+'. '+name+'</b><p>'+msg+'</p></div>'});
document.getElementById("sum").innerHTML='<div class="big '+(pass===cases.length?'g':'r')+'">'+pass+' / '+cases.length+'</div><b>'+(pass===cases.length?'Bestaande Geldcheck intact · Future veilig ernaast':'Integratie-afwijking gevonden')+'</b>';document.getElementById("out").innerHTML=h;};
})();</script></body></html>
