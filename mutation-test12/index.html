<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutation Test 12</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1e9;color:#111;margin:0;padding:22px}
main{max-width:820px;margin:auto}.card,.case{background:#fff;border:1px solid #ddd7ca;border-radius:26px;padding:24px;margin-bottom:14px}
h1{font-size:42px;line-height:1.02;margin:0 0 12px}p,.why{color:#777;line-height:1.45}.small,.why{font-size:13px}
button{width:100%;border:0;border-radius:18px;padding:18px;background:#19765f;color:#fff;font-size:19px;font-weight:850}
.score{font-size:56px;font-weight:900;margin:18px 0 2px}.ok{color:#19765f}.bad{color:#b43131}.mut{font-weight:850}
</style></head><body><main>
<div class="card"><h1>Mutation Test 12</h1>
<p>We maken expres twaalf economische fouten in een geïsoleerde kopie van de rekenlogica. De regressietests moeten elke fout betrappen. De live Geldcheck-engine wordt hierbij niet aangepast.</p>
<p class="small"><b>Build MT1 · 12 opzettelijke economische mutaties · Golden-oracles als detector</b></p>
<button id="run">Run 12 Mutation Tests</button><div id="sum"></div></div><div id="out"></div></main>
<script src="../engine.js?v=1.2"></script>
<script src="../future_layer.js?v=0.1"></script>
<script src="../future_bridge_v041.js?v=0.41"></script>
<script>
(function(){"use strict";
const finite=n=>typeof n==="number"&&Number.isFinite(n);
const B=o=>Object.assign({age:60,income:0,cost:0,cash:0,investments:0,retireAge:60,aow:0,aowStartAge:67,pension:0,pensionStartAge:67},o||{});
const gift=(id,amt,age,certainty="certain")=>({id,type:certainty==="uncertain"?"uncertain_asset":"future_lump_sum",amount:amt,availableFromAge:age,certainty,liquidity:"immediate"});
const inc=(id,m,age,end)=>({id,type:"temporary_income",monthlyAmount:m,availableFromAge:age,endAge:end,certainty:"contractual",liquidity:"immediate"});
const exp=(id,m,age,end)=>({id,type:"future_expense",monthlyAmount:m,availableFromAge:age,endAge:end,certainty:"certain"});
const blocked=(id,v,age)=>({id,type:"blocked_asset",currentValue:v,availableFromAge:age,certainty:"contractual",liquidity:"restricted",restricted:true});

const cases=[
 {name:"cash exact",c:B({cost:1000,cash:12000}),f:{},end:61,expect:0},
 {name:"zekere gift timing",c:B({cost:1000}),f:{events:[gift("g",12000,61)]},end:62,expect:-12000},
 {name:"onzekere gift buiten beschouwing",c:B({cost:1000}),f:{events:[gift("u",12000,60,"uncertain")]},end:61,expect:-12000},
 {name:"restricted buiten consumptie",c:B({cost:1000}),f:{assets:[blocked("b",12000,60)]},end:61,expect:-12000},
 {name:"AOW start",c:B({cost:1000,aow:1000,aowStartAge:61,cash:12000}),f:{},end:62,expect:0},
 {name:"pensioen start",c:B({cost:1000,pension:1000,pensionStartAge:61,cash:12000}),f:{},end:62,expect:0},
 {name:"lijfrente eindigt",c:B({cost:500}),f:{events:[inc("l",500,60,60)]},end:62,expect:-6000},
 {name:"zorgkosten tellen",c:B({cost:1000,cash:18000}),f:{events:[exp("z",500,60,60)]},end:61,expect:0},
 {name:"gift één keer",c:B({cost:0}),f:{events:[gift("g",10000,60)]},end:62,expect:10000},
 {name:"gap wordt terugbetaald",c:B({cost:1000}),f:{events:[gift("g",30000,62)]},end:63,expect:-6000},
 {name:"pre-retirement opbouw",c:B({age:60,retireAge:62,income:4000,cost:3000}),f:{},end:63,expect:-12000},
 {name:"cash wordt eerst gebruikt",c:B({cost:1000,cash:6000}),f:{},end:61,expect:-6000}
];

function mutantSim(raw,future,endAge,m){
  const c=Object.assign({},raw), all=[...((future&&future.assets)||[]),...((future&&future.events)||[])];
  let cash=Math.max(0,c.cash||0), inv=Math.max(0,c.investments||0), gap=0, consumed=new Set(), age=c.age;
  const allowed=x=>{
    if(m==="allow_uncertain") return true;
    return x.certainty==="certain"||x.certainty==="contractual";
  };
  const usable=x=>{
    if(!allowed(x))return false;
    if(m!=="use_restricted" && (x.restricted||x.liquidity==="restricted"||x.liquidity==="illiquid"))return false;
    return !["temporary_income","lifetime_income","future_expense"].includes(x.type);
  };
  const add=amt=>{
    if(m==="dont_repay_gap"){inv+=amt;return}
    const r=Math.min(gap,amt);gap-=r;amt-=r;if(amt>0)inv+=amt;
  };
  const spend=need=>{
    if(m!=="ignore_cash"){const u=Math.min(cash,need);cash-=u;need-=u}
    const v=Math.min(inv,need);inv-=v;need-=v;
    if(need>0)gap+=need;
  };
  while(age<c.retireAge){
    let annual=(c.income-c.cost)*12;
    if(m==="skip_preretirement")annual=0;
    if(annual>=0)inv+=annual;else spend(-annual);
    age++;
  }
  while(age<endAge){
    for(const x of all){
      const start=m==="gift_one_year_early" && x.type==="future_lump_sum" ? (x.availableFromAge-1) : x.availableFromAge;
      if(usable(x)&&!consumed.has(x.id)&&age>=start){
        const amt=finite(x.amount)?x.amount:(finite(x.currentValue)?x.currentValue:0);
        if(amt>0){add(amt);if(m!=="duplicate_gift")consumed.add(x.id)}
      }
    }
    let extraI=0,extraE=0;
    for(const x of all){
      if(allowed(x)&&(x.type==="temporary_income"||x.type==="lifetime_income")&&age>=x.availableFromAge){
        const ended=finite(x.endAge)&&age>x.endAge;
        if(!ended||m==="income_never_ends")extraI+=(x.monthlyAmount||0)*12;
      }
      if(allowed(x)&&x.type==="future_expense"&&age>=x.availableFromAge&&(x.endAge==null||age<=x.endAge)){
        if(m!=="ignore_expense")extraE+=(x.monthlyAmount||0)*12;
      }
    }
    const aowStart=m==="aow_one_year_early"?(c.aowStartAge-1):c.aowStartAge;
    const penStart=m==="pension_one_year_early"?(c.pensionStartAge-1):c.pensionStartAge;
    const aow=age>=aowStart?(c.aow||0)*12:0;
    const pen=age>=penStart?(c.pension||0)*12:0;
    let net=aow+pen+extraI-(c.cost*12+extraE);
    if(net>=0)add(net);else spend(-net);
    age++;
  }
  return cash+inv-gap;
}

const mutants=[
 ["M1 Onzekere gift tóch gebruiken","allow_uncertain"],
 ["M2 Restricted vermogen tóch gebruiken","use_restricted"],
 ["M3 Gift één jaar te vroeg gebruiken","gift_one_year_early"],
 ["M4 AOW één jaar te vroeg starten","aow_one_year_early"],
 ["M5 Pensioen één jaar te vroeg starten","pension_one_year_early"],
 ["M6 Lijfrente nooit laten eindigen","income_never_ends"],
 ["M7 Zorgkosten negeren","ignore_expense"],
 ["M8 Gift ieder jaar opnieuw tellen","duplicate_gift"],
 ["M9 Funding gap niet eerst terugbetalen","dont_repay_gap"],
 ["M10 Pre-retirement opbouw overslaan","skip_preretirement"],
 ["M11 Cash volledig negeren","ignore_cash"],
 ["M12 Gift timing +1 jaar tolerantie breken","gift_one_year_early"]
];

document.getElementById("run").onclick=()=>{
  let killed=0,h="";
  mutants.forEach((z,idx)=>{
    const [name,mut]=z;let caught=false,detectors=[];
    cases.forEach((t,i)=>{
      const got=mutantSim(t.c,t.f,t.end,mut);
      if(Math.abs(got-t.expect)>.01){caught=true;detectors.push((i+1)+" "+t.name)}
    });
    if(caught)killed++;
    h+='<div class="case"><b class="'+(caught?'ok':'bad')+'">'+(caught?'KILLED':'SURVIVED')+' · '+name+'</b><div class="why">'+(caught?'Betrappen door: '+detectors.slice(0,4).join(" · "):'Geen oracle sloeg alarm — testdekking onvoldoende')+'</div></div>';
  });
  const pct=Math.round(killed/mutants.length*100);
  document.getElementById("sum").innerHTML='<div class="score '+(killed===mutants.length?'ok':'bad')+'">'+killed+' / '+mutants.length+'</div><b>Mutation score '+pct+'%</b><p>'+(killed===mutants.length?'Alle opzettelijke economische fouten worden door de tests gedetecteerd.':'Minstens één fout kan nog onopgemerkt door de testmachine glippen.')+'</p>';
  document.getElementById("out").innerHTML=h;
};
})();</script></body></html>
